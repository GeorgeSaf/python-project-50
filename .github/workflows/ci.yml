name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Check types
        run: make check

      - name: Run linter
        run: make lint

      - name: Test with coverage
        run: make test-coverage
